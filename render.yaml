services:
  - type: web
    name: incidentlens
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r server/requirements.txt"
    startCommand: "python -m uvicorn server.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HINDSIGHT_BASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
